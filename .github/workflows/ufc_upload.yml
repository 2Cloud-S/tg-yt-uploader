name: UFC Daily Uploader

on:
  schedule:
    - cron: '0 16 * * *'   # 04:00 UTC = 09:00 AM PKT
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install telethon googletrans==4.0.0rc1 google-api-python-client google-auth-oauthlib

      - name: Run UFC uploader
        env:
          NICHE: ufc
          TELEGRAM_API_ID:       ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:     ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:      ${{ secrets.TELEGRAM_SESSION }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python uploader.py --niche ufc

      - name: Commit state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_ids_ufc.txt archive_state_ufc.json
          git diff --staged --quiet || git commit -m "UFC state update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
