name: Animals Daily Uploader

on:
  schedule:
    - cron: '0 18 * * *'   # 06:00 UTC = 11:00 AM PKT (2 hours after UFC run)
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install telethon googletrans==4.0.0rc1 google-api-python-client google-auth-oauthlib

      - name: Run Animals uploader
        env:
          NICHE: animals
          TELEGRAM_API_ID:              ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:            ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:             ${{ secrets.TELEGRAM_SESSION }}
          ANIMALS_YOUTUBE_CLIENT_ID:     ${{ secrets.ANIMALS_YOUTUBE_CLIENT_ID }}
          ANIMALS_YOUTUBE_CLIENT_SECRET: ${{ secrets.ANIMALS_YOUTUBE_CLIENT_SECRET }}
          ANIMALS_YOUTUBE_REFRESH_TOKEN: ${{ secrets.ANIMALS_YOUTUBE_REFRESH_TOKEN }}
        run: python uploader.py --niche animals

      - name: Commit state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_ids_animals.txt archive_state_animals.json
          git diff --staged --quiet || git commit -m "Animals state update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
